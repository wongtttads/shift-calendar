name: Update shift calendar

on:
  schedule:
    # 每周一 00:30 北京时间(UTC 16:30 周日)
    - cron: '30 16 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate calendar.ics
        run: python3 generate.py

      - name: Commit updated calendar
        run: |
          git config user.name "shift-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add calendar.ics
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh calendar $(date +%F)"
            git pull --rebase origin main
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
